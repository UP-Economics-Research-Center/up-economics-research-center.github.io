name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Refresh seminar schedule (retain last deployed feed on failure)
        id: seminars
        run: python3 tools/seminar_sheet.py
      - name: Build approved content and static pages
        run: python3 tools/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site files
        id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - name: Deploy this run's exact artifact to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: python3 tools/deploy_pages.py
      - name: Flag retained seminar data for maintainer attention
        if: steps.seminars.outputs.status == 'recovered'
        run: |
          echo "::error::The site was deployed safely, but the seminar import failed and retained the previous schedule. Check the Seminar schedule job summary, correct the reported source problem, and run this workflow again."
          exit 1
