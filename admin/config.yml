backend:
  name: github
  repo: UP-Economics-Research-Center/up-economics-research-center.github.io
  branch: main
  open_authoring: false
  base_url: https://up-economics-decap-auth.jadrk040507.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo
publish_mode: editorial_workflow
locale: en
media_folder: design/assets/uploads
public_folder: /design/assets/uploads
site_url: https://up-economics-research-center.github.io
show_preview_links: false
collections:
- name: site_settings
  label: Site settings
  description: Update approved home-page copy and site-wide details.
  files:
  - name: site
    label: Home page and site details
    file: content/settings/site.json
    format: json
    fields:
    - label: Center name
      name: center_name
      widget: string
      hint: Always use UP Economics Research Center, in both languages.
    - label: Center name — Spanish
      name: center_name_es
      widget: string
      hint: Keep UP Economics Research Center unchanged; do not translate the institution name.
    - label: University
      name: university
      widget: string
    - label: Show News publicly
      name: show_news
      widget: boolean
      default: false
      required: false
    - label: Show Seminars publicly
      name: show_seminars
      widget: boolean
      default: false
      required: false
    - label: Show working papers publicly / Mostrar documentos de trabajo
      name: show_working_papers
      widget: boolean
      default: false
      hint: Turn off to hide this type everywhere on the public site without deleting its records.
    - label: Show policy briefs publicly / Mostrar notas de política
      name: show_policy_briefs
      widget: boolean
      default: false
      hint: Turn off to hide this type everywhere on the public site without deleting its records.
    - label: Home-page heading
      name: hero_heading
      widget: string
      required: false
      hint: Use only copy approved by the Center.
    - label: Home-page heading — Spanish
      name: hero_heading_es
      widget: string
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Home-page introduction
      name: hero_summary
      widget: text
      required: false
      hint: Keep claims supported by an official source.
    - label: Home-page introduction — Spanish
      name: hero_summary_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Campus video ID
      name: campus_video_id
      widget: string
      pattern:
      - ^[A-Za-z0-9_-]{11}$
      - Enter the 11-character YouTube video ID.
    - label: Campus video caption
      name: campus_video_caption
      widget: string
    - label: Campus video caption — Spanish
      name: campus_video_caption_es
      widget: string
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Footer note
      name: footer_note
      widget: string
      required: false
      hint: Preserve the design-preview note until the Center approves final copy.
    - label: Footer note — Spanish
      name: footer_note_es
      widget: string
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Campus video title
      name: campus_video_title
      widget: string
    - label: Campus video poster
      name: campus_video_poster
      widget: image
    - label: Poster alternative text
      name: campus_video_poster_alt
      widget: string
    - label: Featured paper
      name: featured_publication_slug
      widget: relation
      collection: publications
      search_fields:
      - title
      display_fields:
      - title
      value_field: slug
      required: false
    - label: Feature image
      name: featured_image
      widget: image
      required: false
    - label: Feature image alternative text
      name: featured_image_alt
      widget: string
      required: false
    - label: Image credit
      name: featured_image_credit
      widget: string
      required: false
    - label: Image source URL
      name: featured_image_source_url
      widget: string
      required: false
- name: about_settings
  label: Home scope, contact and seminar information
  description: Keep all public claims and contact details supported by a current source.
  files:
  - name: about
    label: Home scope, collaboration and contact
    file: content/settings/about.json
    format: json
    fields:
    - label: Include these details on website / Mostrar estos datos
      name: published
      widget: boolean
      default: false
      hint: Controls visibility after approval and publication. This is not an approval switch; saving keeps the change in review.
    - label: Center scope
      name: scope
      widget: text
      required: false
    - label: Center scope — Spanish
      name: scope_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Research scope
      name: research_scope
      widget: text
      required: false
    - label: Research scope — Spanish
      name: research_scope_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Collaboration information
      name: collaboration
      widget: text
      required: false
    - label: Collaboration — Spanish
      name: collaboration_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Contact introduction
      name: contact_intro
      widget: text
      required: false
    - label: Contact introduction — Spanish
      name: contact_intro_es
      widget: text
      required: false
    - label: Institutional affiliation
      name: affiliation
      widget: text
      required: false
    - label: Institutional affiliation — Spanish
      name: affiliation_es
      widget: text
      required: false
    - label: Postal address
      name: address
      widget: text
      required: false
    - label: Editorial review note
      name: editorial_note
      widget: text
      required: false
    - label: Editorial review note — Spanish
      name: editorial_note_es
      widget: text
      required: false
    - label: Public contact email
      name: contact_email
      widget: string
      required: false
    - label: Reference URL (optional)
      name: source_url
      widget: string
      required: false
      hint: Optional link to any page or document that supports this information.
    - label: Last verified
      name: verified_on
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      required: false
    - label: Seminar information
      name: seminar_description
      widget: text
      required: false
      hint: Public introduction on the independent Seminars page.
    - label: Seminar information — Spanish
      name: seminar_description_es
      widget: text
      required: false
    - label: Usual seminar schedule — English
      name: seminar_schedule
      widget: text
      required: false
    - label: Usual seminar schedule — Spanish
      name: seminar_schedule_es
      widget: text
      required: false
    - label: Session confirmation note — English
      name: seminar_schedule_note
      widget: text
      required: false
    - label: Session confirmation note — Spanish
      name: seminar_schedule_note_es
      widget: text
      required: false
    - label: Proposal form note — English
      name: seminar_form_note
      widget: text
      required: false
    - label: Proposal form note — Spanish
      name: seminar_form_note_es
      widget: text
      required: false
    - label: Seminar proposal types
      name: seminar_proposals
      widget: list
      required: false
      fields:
      - label: Type — English
        name: label
        widget: string
      - label: Type — Spanish
        name: label_es
        widget: string
      - label: Description — English
        name: description
        widget: text
      - label: Description — Spanish
        name: description_es
        widget: text
    - label: Seminar information last verified
      name: seminar_verified_on
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      required: false
    - label: Seminar proposal form URL
      name: seminar_form_url
      widget: string
      required: false
      hint: The linked Google Form is currently in Spanish.
    - label: Seminar information source
      name: seminar_source_url
      widget: string
      required: false
    - label: Contact reference URL
      name: contact_source_url
      widget: string
      required: false
    - label: Contact last verified
      name: contact_verified_on
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      required: false
- name: people
  label: Researchers
  label_singular: Researcher
  description: Add a person only after their affiliation, role, and profile text are verified.
  folder: content/people
  create: true
  extension: json
  format: json
  identifier_field: name
  slug: '{{fields.slug}}'
  summary: '{{name}} · {{role}}'
  fields:
  - label: Name
    name: name
    widget: string
  - label: Public display name / Nombre público
    name: display_name
    widget: string
    required: false
    hint: Keep the complete name above. Use the preferred public name here; do not change publication citations.
  - label: Display order
    name: display_order
    widget: number
    value_type: int
    min: 1
    default: 999
    required: false
    hint: Lower numbers appear first within the person's group.
  - label: Stable URL slug
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Use lowercase letters, numbers, and single hyphens.
  - label: Role
    name: role
    widget: select
    options:
    - Lead researcher
    - Research professional
    - Other
  - label: Biography
    name: bio
    widget: text
  - label: Biography — Spanish
    name: bio_es
    widget: text
    required: true
    hint: Translate the complete English text faithfully before publishing.
  - label: Portrait
    name: portrait
    widget: image
    required: false
  - label: Portrait framing (percentages)
    name: portrait_crop
    widget: object
    required: false
    collapsed: true
    hint: Keeps the original file intact. Left and top set the start of the crop; width and height set how much of the original is visible. Remove this group for automatic framing.
    fields:
    - {label: Left, name: left, widget: number, value_type: float, min: 0, max: 100, default: 0}
    - {label: Top, name: top, widget: number, value_type: float, min: 0, max: 100, default: 0}
    - {label: Width, name: width, widget: number, value_type: float, min: 0.001, max: 100, default: 100}
    - {label: Height, name: height, widget: number, value_type: float, min: 0.001, max: 100, default: 100}
  - label: Portrait alternative text
    name: portrait_alt
    widget: string
    required: false
  - label: Portrait alternative text — Spanish
    name: portrait_alt_es
    widget: string
    required: false
    hint: Translate the complete English text faithfully before publishing.
  - label: Research areas
    name: research_areas
    widget: relation
    collection: research_areas
    search_fields:
    - name
    display_fields:
    - name
    value_field: slug
    multiple: true
    required: false
  - label: Personal website URL
    name: personal_website
    widget: string
    required: false
    hint: Use a verified personal site. Leave empty if none is known.
  - label: Official profile URL
    name: canonical_url
    widget: string
    required: false
  - label: Reference URL (optional)
    name: source_url
    widget: string
    required: false
    hint: Optional link to any page or document that supports this information.
  - label: Last verified
    name: verified_on
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
  - label: Include this profile on website / Mostrar este perfil
    name: published
    widget: boolean
    default: false
    hint: Turn on to include this record after review and publication. Off keeps it hidden. Saving a draft does not update the live site.
- name: research_areas
  label: Research areas
  label_singular: Research area
  description: Use a stable topic ID and link all people by their record slug.
  folder: content/research-areas
  create: true
  extension: json
  format: json
  identifier_field: name
  slug: '{{fields.slug}}'
  summary: '{{name}}'
  fields:
  - label: Name
    name: name
    widget: string
  - label: Name — Spanish
    name: name_es
    widget: string
  - label: Display order
    name: display_order
    widget: number
    value_type: int
    min: 1
  - label: Stable URL ID
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Use lowercase letters, numbers, and single hyphens.
  - label: Summary
    name: summary
    widget: text
    hint: Opening description below the area cover. Keep the complete approved wording; the overview continues underneath.
  - label: Summary — Spanish
    name: summary_es
    widget: text
    required: false
    hint: Translate the complete English text faithfully before publishing.
  - label: Research image and area cover / Imagen de Research y portada
    name: image
    widget: image
    required: false
    hint: This is the primary image for both the Research card and the large individual area cover. Keep the approved original; the page uses the same file at a larger display size.
  - label: Photograph alternative text
    name: image_alt
    widget: string
    required: false
  - label: Photograph alternative text — Spanish
    name: image_alt_es
    widget: string
    required: false
  - label: Photograph credit and license
    name: image_credit
    widget: string
    required: false
  - label: Photograph source URL
    name: image_source_url
    widget: string
    required: false
  - label: Photograph license URL
    name: image_license_url
    widget: string
    required: false
  - label: Area page design / Diseño de página
    name: layout
    widget: select
    required: false
    default: original-reference
    options:
    - label: Standard area design
      value: standard
    - label: Original photo-led reference
      value: original-reference
    hint: All areas use the photo-led design. Keep a local cover photograph;
      projects show their photographs when provided.
  - label: Alternate cover / Portada alternativa
    name: banner
    widget: object
    required: false
    hint: Used only when the primary Research image above is empty. Previous cover files are preserved here; they do not replace the approved Research image.
    fields:
    - label: Original photograph
      name: image
      widget: image
    - label: Alternative text — English
      name: image_alt
      widget: string
    - label: Alternative text — Spanish
      name: image_alt_es
      widget: string
    - label: Photograph credit
      name: image_credit
      widget: string
    - label: Photograph source URL
      name: image_source_url
      widget: string
  - label: Team selection / Selección del equipo
    name: reference_team
    widget: list
    required: false
    hint: Choose people and their order. Photos and framing always come from People.
      Leave empty to use research-area assignments. Change a portrait only in People.
    fields:
    - label: Researcher
      name: person_id
      widget: relation
      collection: people
      search_fields:
      - name
      value_field: slug
      display_fields:
      - name
  - label: Full publication features for original layout
    name: publication_features
    widget: list
    required: false
    fields:
    - label: Publication
      name: publication
      widget: relation
      collection: publications
      search_fields:
      - title
      value_field: slug
      display_fields:
      - title
    - label: Complete original description — English
      name: description
      widget: text
    - label: Complete description — Spanish
      name: description_es
      widget: text
    - label: Related media links
      name: media_links
      widget: list
      required: false
      fields:
      - label: Link label — English
        name: label
        widget: string
      - label: Link label — Spanish
        name: label_es
        widget: string
      - label: URL
        name: url
        widget: string
  - label: Area overview
    name: overview
    widget: text
    hint: Preserve the complete source wording and paragraph breaks.
  - label: Area overview — Spanish
    name: overview_es
    widget: text
    required: false
    hint: Translate the complete English text faithfully before publishing.
  - label: Ongoing research
    name: projects
    widget: list
    required: false
    fields:
    - label: Project title
      name: title
      widget: string
    - label: Project title — Spanish
      name: title_es
      widget: string
    - label: Project summary
      name: summary
      widget: text
    - label: Researcher and presentation notes
      name: researcher_note
      widget: text
      required: false
    - label: Researcher and presentation notes — Spanish
      name: researcher_note_es
      widget: text
      required: false
    - label: Article URL
      name: url
      widget: string
      required: false
    - label: Photograph
      name: image
      widget: image
      required: false
    - label: Image display / Presentación de imagen
      name: image_fit
      widget: select
      required: false
      default: cover
      hint: Use complete image for diagrams or text that must remain readable. / Usa imagen completa para gráficos o texto que deba ser legible.
      options:
      - label: Photograph — match text height / Fotografía — altura del texto
        value: cover
      - label: Complete diagram / Gráfico completo
        value: contain
    - label: Photograph focus / Zona principal de la foto
      name: image_focus
      widget: select
      required: false
      default: center
      options:
      - {label: 'Top / Arriba', value: top}
      - {label: 'Center / Centro', value: center}
      - {label: 'Bottom / Abajo', value: bottom}
    - label: Photograph alternative text
      name: image_alt
      widget: string
      required: false
    - label: Photograph alternative text — Spanish
      name: image_alt_es
      widget: string
      required: false
    - label: Photograph credit and license
      name: image_credit
      widget: string
      required: false
    - label: Photograph source URL
      name: image_source_url
      widget: string
      required: false
    - label: Photograph license URL
      name: image_license_url
      widget: string
      required: false
    - label: Summary — Spanish
      name: summary_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Researchers
      name: researchers
      widget: list
      field:
        label: Researcher name
        name: name
        widget: string
  - label: Researchers
    name: people
    widget: list
    field:
      label: Researcher slug
      name: person_id
      widget: string
    required: false
  - label: Official page URL
    name: canonical_url
    widget: string
    required: false
  - label: Reference URL (optional)
    name: source_url
    widget: string
    required: false
    hint: Optional link to any page or document that supports this information.
  - label: Last verified
    name: verified_on
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
  - label: Include this area on website / Mostrar esta área
    name: published
    widget: boolean
    default: false
    hint: Turn on to include this record after review and publication. Off keeps it hidden. Saving a draft does not update the live site.
- name: publications
  label: Publications
  label_singular: Publication
  description: Every author, abstract, citation, and paper link must be checked against a source.
  folder: content/publications
  create: true
  extension: json
  format: json
  identifier_field: title
  slug: '{{fields.slug}}'
  summary: '{{year}} · {{title}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Original title language / Idioma original del título
    name: title_language
    widget: select
    default: en
    options:
    - label: English / Inglés
      value: en
    - label: Spanish / Español
      value: es
    hint: Keep the complete original title in both site languages. Select the language in which the title was written; do not translate it.
  - label: Stable URL slug
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Use lowercase letters, numbers, and single hyphens.
  - label: Authors in citation order
    name: authors
    widget: list
    fields:
    - label: Author name
      name: name
      widget: string
    - label: Center researcher
      name: person_id
      widget: relation
      required: false
      collection: people
      search_fields:
      - name
      display_fields:
      - name
      value_field: slug
  - label: Companion policy brief / Nota de política asociada
    name: policy_brief_id
    widget: relation
    required: false
    collection: publications
    search_fields: [title]
    display_fields: [title]
    value_field: slug
    hint: Choose a published record with type Policy brief; leave empty otherwise. / Elige una nota de política publicada; deja vacío si no existe.
  - label: Image reuse status / Permiso para mostrar la imagen
    name: image_rights_status
    widget: select
    required: false
    default: pending
    options:
    - {label: 'Pending — show bibliographic reference / Pendiente — mostrar referencia', value: pending}
    - {label: 'Reuse license verified / Licencia de reutilización verificada', value: licensed}
    - {label: 'Permission confirmed / Permiso confirmado', value: permission-confirmed}
  - label: Public rights evidence URL / Fuente pública del permiso
    name: image_rights_url
    widget: string
    required: false
    hint: Required to display the image; use an official article license or documented permission. Do not upload private permission correspondence here.
  - label: Image license name / Nombre de la licencia
    name: image_license
    widget: string
    required: false
  - label: Article first-page image / Primera página del artículo
    name: image
    widget: image
    required: false
    hint: Upload an authentic first page only when reuse is licensed or permission is confirmed. Pending images are not deployed; a clearly labelled bibliographic reference is displayed instead. A website screenshot is not automatically copyright-free.
  - label: Photograph alternative text
    name: image_alt
    widget: string
    required: false
  - label: Photograph alternative text — Spanish
    name: image_alt_es
    widget: string
    required: false
  - label: Photograph credit and license
    name: image_credit
    widget: string
    required: false
  - label: Photograph source URL
    name: image_source_url
    widget: string
    required: false
  - label: Photograph license URL
    name: image_license_url
    widget: string
    required: false
  - label: Abstract
    name: abstract
    widget: text
  - label: Abstract — Spanish
    name: abstract_es
    widget: text
    required: true
    hint: Translate the complete English text faithfully before publishing.
  - label: Year
    name: year
    widget: number
    value_type: int
    min: 1900
    max: 2100
  - label: Exact publication date / Fecha exacta de publicación
    name: publication_date
    widget: string
    required: false
    pattern: ['^\d{4}-\d{2}-\d{2}$', 'Use YYYY-MM-DD / Usa AAAA-MM-DD']
    hint: Optional. Verify the exact date in a primary source; no future dates. New lasts 90 days only with its source URL.
  - label: Date primary source / Fuente primaria de la fecha
    name: publication_date_source_url
    widget: string
    required: false
    pattern: ['^https://[^\s]+$', 'Use HTTPS']
    hint: Without both date and source there is no New badge. Year and verification date do not count.
  - label: ISBN
    name: isbn
    widget: string
    required: false
  - label: Publication type
    name: type
    widget: select
    options:
    - Journal article
    - Working paper
    - Book
    - Book chapter
    - Policy brief
    - Conference paper
    - Case study
    - Other
  - label: Journal, series or publisher
    name: venue
    widget: string
    required: false
  - label: DOI
    name: doi
    widget: string
    required: false
    hint: Enter the DOI only, such as 10.1234/example.
  - label: Publisher or canonical page
    name: canonical_url
    widget: string
    required: false
  - label: Approved paper file
    name: pdf
    widget: file
    required: false
  - label: External download URL
    name: pdf_url
    widget: string
    required: false
  - label: Research areas
    name: topics
    widget: relation
    collection: research_areas
    search_fields:
    - name
    display_fields:
    - name
    value_field: slug
    multiple: true
    required: false
  - label: Reference URL (optional)
    name: source_url
    widget: string
    required: false
    hint: Optional link to any page or document that supports this information.
  - label: Last verified
    name: verified_on
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
  - label: Include this publication on website / Mostrar esta publicación
    name: published
    widget: boolean
    default: false
    hint: Turn on to include this record after review and publication. Off keeps it hidden. Saving a draft does not update the live site.
- name: news
  label: News
  label_singular: News item
  description: Publish only sourced announcements from the Center.
  folder: content/news
  create: true
  extension: json
  format: json
  identifier_field: title
  slug: '{{fields.slug}}'
  summary: '{{date}} · {{title}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Title — Spanish
    name: title_es
    widget: string
  - label: Stable URL slug
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Use lowercase letters, numbers, and single hyphens.
  - label: Date
    name: date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
  - label: Category
    name: category
    widget: select
    options:
    - Announcement
    - Publication
    - People
    - Seminar
    - Research
  - label: Summary
    name: summary
    widget: text
  - label: Summary — Spanish
    name: summary_es
    widget: text
    required: false
    hint: Translate the complete English text faithfully before publishing.
  - label: Story
    name: body
    widget: text
    required: false
  - label: Story — Spanish
    name: body_es
    widget: text
    required: false
  - label: Canonical URL
    name: canonical_url
    widget: string
    required: false
  - label: Reference URL (optional)
    name: source_url
    widget: string
    required: false
    hint: Optional link to any page or document that supports this information.
  - label: Last verified
    name: verified_on
