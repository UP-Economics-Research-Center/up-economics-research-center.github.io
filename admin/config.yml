backend:
  name: github
  repo: UP-Economics-Research-Center/up-economics-research-center.github.io
  branch: main
  open_authoring: false
  base_url: https://up-economics-decap-auth.jadrk040507.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo
publish_mode: simple
locale: en
media_folder: design/assets/uploads
public_folder: /design/assets/uploads
site_url: https://up-economics-research-center.github.io
show_preview_links: false
collections:
- name: site_settings
  label: Site settings
  description: Update approved home-page copy and site-wide details.
  files:
  - name: site
    label: Home page and site details
    file: content/settings/site.json
    format: json
    fields:
    - label: Center name
      name: center_name
      widget: string
    - label: Center name — Spanish
      name: center_name_es
      widget: string
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: University
      name: university
      widget: string
    - label: Show News publicly
      name: show_news
      widget: boolean
      default: false
      required: false
    - label: Show Seminars publicly
      name: show_seminars
      widget: boolean
      default: false
      required: false
    - label: Show working papers publicly / Mostrar documentos de trabajo
      name: show_working_papers
      widget: boolean
      default: false
      hint: Turn off to hide this type everywhere on the public site without deleting its records.
    - label: Show policy briefs publicly / Mostrar notas de política
      name: show_policy_briefs
      widget: boolean
      default: false
      hint: Turn off to hide this type everywhere on the public site without deleting its records.
    - label: Home-page heading
      name: hero_heading
      widget: string
      required: false
      hint: Use only copy approved by the Center.
    - label: Home-page heading — Spanish
      name: hero_heading_es
      widget: string
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Home-page introduction
      name: hero_summary
      widget: text
      required: false
      hint: Keep claims supported by an official source.
    - label: Home-page introduction — Spanish
      name: hero_summary_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Campus video ID
      name: campus_video_id
      widget: string
      pattern:
      - ^[A-Za-z0-9_-]{11}$
      - Enter the 11-character YouTube video ID.
    - label: Campus video caption
      name: campus_video_caption
      widget: string
    - label: Campus video caption — Spanish
      name: campus_video_caption_es
      widget: string
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Footer note
      name: footer_note
      widget: string
      required: false
      hint: Preserve the design-preview note until the Center approves final copy.
    - label: Footer note — Spanish
      name: footer_note_es
      widget: string
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Campus video title
      name: campus_video_title
      widget: string
    - label: Campus video poster
      name: campus_video_poster
      widget: image
    - label: Poster alternative text
      name: campus_video_poster_alt
      widget: string
    - label: Featured paper
      name: featured_publication_slug
      widget: relation
      collection: publications
      search_fields:
      - title
      display_fields:
      - title
      value_field: slug
      required: false
    - label: Feature image
      name: featured_image
      widget: image
      required: false
    - label: Feature image alternative text
      name: featured_image_alt
      widget: string
      required: false
    - label: Image credit
      name: featured_image_credit
      widget: string
      required: false
    - label: Image source URL
      name: featured_image_source_url
      widget: string
      required: false
- name: about_settings
  label: Home scope, contact and seminar information
  description: Keep all public claims and contact details supported by a current source.
  files:
  - name: about
    label: Home scope, collaboration and contact
    file: content/settings/about.json
    format: json
    fields:
    - label: Publish these details
      name: published
      widget: boolean
      default: false
      hint: Turn this on only when the content is ready to appear on the public site.
    - label: Center scope
      name: scope
      widget: text
      required: false
    - label: Center scope — Spanish
      name: scope_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Research scope
      name: research_scope
      widget: text
      required: false
    - label: Research scope — Spanish
      name: research_scope_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Collaboration information
      name: collaboration
      widget: text
      required: false
    - label: Collaboration — Spanish
      name: collaboration_es
      widget: text
      required: false
      hint: Translate the complete English text faithfully before publishing.
    - label: Contact introduction
      name: contact_intro
      widget: text
      required: false
    - label: Contact introduction — Spanish
      name: contact_intro_es
      widget: text
      required: false
    - label: Institutional affiliation
      name: affiliation
      widget: text
      required: false
    - label: Institutional affiliation — Spanish
      name: affiliation_es
      widget: text
      required: false
    - label: Postal address
      name: address
      widget: text
      required: false
    - label: Editorial review note
      name: editorial_note
      widget: text
      required: false
    - label: Editorial review note — Spanish
      name: editorial_note_es
      widget: text
      required: false
    - label: Public contact email
      name: contact_email
      widget: string
      required: false
    - label: Reference URL (optional)
      name: source_url
      widget: string
      required: false
      hint: Optional link to any page or document that supports this information.
    - label: Last verified
      name: verified_on
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      required: false
    - label: Seminar information
      name: seminar_description
      widget: text
      required: false
      hint: Public introduction on the independent Seminars page.
    - label: Seminar information — Spanish
      name: seminar_description_es
      widget: text
      required: false
    - label: Usual seminar schedule — English
      name: seminar_schedule
      widget: text
      required: false
    - label: Usual seminar schedule — Spanish
      name: seminar_schedule_es
      widget: text
      required: false
    - label: Session confirmation note — English
      name: seminar_schedule_note
      widget: text
      required: false
    - label: Session confirmation note — Spanish
      name: seminar_schedule_note_es
      widget: text
      required: false
    - label: Proposal form note — English
      name: seminar_form_note
      widget: text
      required: false
    - label: Proposal form note — Spanish
      name: seminar_form_note_es
      widget: text
      required: false
    - label: Seminar proposal types
      name: seminar_proposals
      widget: list
      required: false
      fields:
      - label: Type — English
        name: label
        widget: string
      - label: Type — Spanish
        name: label_es
        widget: string
      - label: Description — English
        name: description
        widget: text
      - label: Description — Spanish
        name: description_es
        widget: text
    - label: Seminar information last verified
      name: seminar_verified_on
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      required: false
    - label: Seminar proposal form URL
      name: seminar_form_url
      widget: string
      required: false
      hint: The linked Google Form is currently in Spanish.
    - label: Seminar information source
      name: seminar_source_url
      widget: string
      required: false
    - label: Publish public Contact details
      name: contact_published
      widget: boolean
      default: false
    - label: Public institutional address
      name: contact_address
      widget: text
      required: false
    - label: Contact reference URL
      name: contact_source_url
      widget: string
      required: false
    - label: Contact last verified
      name: contact_verified_on
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      required: false
- name: people
  label: Researchers
  label_singular: Researcher
  description: Add a person only after their affiliation, role, and profile text are verified.
  folder: content/people
  create: true
  extension: json
  format: json
  identifier_field: name
  slug: '{{fields.slug}}'
  summary: '{{name}} · {{role}}'
  fields:
  - label: Name
    name: name
    widget: string
  - label: Public display name / Nombre público
    name: display_name
    widget: string
    required: false
    hint: Keep the complete name above. Use the preferred public name here; do not change publication citations.
  - label: Display order
    name: display_order
    widget: number
    value_type: int
    min: 1
    default: 999
    required: false
    hint: Lower numbers appear first within the person's group.
  - label: Stable URL slug
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Use lowercase letters, numbers, and single hyphens.
  - label: Role
    name: role
    widget: select
    options:
    - Lead researcher
    - Research professional
    - Other
  - label: Biography
    name: bio
    widget: text
  - label: Biography — Spanish
    name: bio_es
    widget: text
    required: true
    hint: Translate the complete English text faithfully before publishing.
  - label: Portrait
    name: portrait
    widget: image
    required: false
  - label: Portrait alternative text
    name: portrait_alt
    widget: string
    required: false
  - label: Portrait alternative text — Spanish
    name: portrait_alt_es
    widget: string
    required: false
    hint: Translate the complete English text faithfully before publishing.
  - label: Research areas
    name: research_areas
    widget: relation
    collection: research_areas
    search_fields:
    - name
    display_fields:
    - name
    value_field: slug
    multiple: true
    required: false
  - label: Personal website URL
    name: personal_website
    widget: string
    required: false
    hint: Use a verified personal site. Leave empty if none is known.
  - label: Official profile URL
    name: canonical_url
    widget: string
    required: false
  - label: Reference URL (optional)
    name: source_url
    widget: string
    required: false
    hint: Optional link to any page or document that supports this information.
  - label: Last verified
    name: verified_on
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
  - label: Publish this profile
    name: published
    widget: boolean
    default: false
- name: research_areas
