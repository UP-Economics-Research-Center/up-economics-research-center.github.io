  - label: Ongoing research
    name: projects
    widget: list
    required: false
    fields:
    - label: Project title
      name: title
      widget: string
    - label: Project title — Spanish
      name: title_es
      widget: string
    - label: Project summary
      name: summary
      widget: text
    - label: Researcher and presentation notes
      name: researcher_note
      widget: text
      required: false
    - label: Researcher and presentation notes — Spanish
      name: researcher_note_es
      widget: text
      required: false
    - label: Article URL
      name: url
