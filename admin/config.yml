- name: publications
  label: Publications
  label_singular: Publication
  description: Every author, abstract, citation, and paper link must be checked against a source.
  folder: content/publications
  create: true
  extension: json
  format: json
  identifier_field: title
  slug: '{{fields.slug}}'
  summary: '{{year}} · {{title}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Stable URL slug
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Use lowercase letters, numbers, and single hyphens.
  - label: Authors in citation order
    name: authors
    widget: list
    fields:
    - label: Author name
      name: name
      widget: string
    - label: Center researcher
      name: person_id
      widget: relation
      required: false
      collection: people
      search_fields:
      - name
      display_fields:
      - name
      value_field: slug
  - label: Photograph
    name: image
    widget: image
    required: false
    hint: Optional. The public image block is hidden when empty.
  - label: Photograph alternative text
    name: image_alt
    widget: string
    required: false
  - label: Photograph alternative text — Spanish
    name: image_alt_es
    widget: string
    required: false
  - label: Photograph credit and license
    name: image_credit
    widget: string
    required: false
  - label: Photograph source URL
    name: image_source_url
    widget: string
    required: false
  - label: Photograph license URL
    name: image_license_url
    widget: string
    required: false
  - label: Abstract
    name: abstract
    widget: text
  - label: Abstract — Spanish
    name: abstract_es
    widget: text
    required: true
    hint: Translate the complete English text faithfully before publishing.
  - label: Year
    name: year
    widget: number
    value_type: int
    min: 1900
    max: 2100
  - label: Publication type
    name: type
    widget: select
    options:
    - Journal article
    - Working paper
    - Book
    - Book chapter
    - Policy brief
    - Other
  - label: Journal
    series: null
    or publisher: null
    name: venue
    widget: string
    required: false
  - label: DOI
    name: doi
    widget: string
    required: false
    hint: Enter the DOI only
    such as 10.1234/example.: null
  - label: Publisher or canonical page
    name: canonical_url
    widget: string
    required: false
  - label: Approved paper file
    name: pdf
    widget: file
    required: false
  - label: External download URL
    name: pdf_url
    widget: string
    required: false
  - label: Research areas
    name: topics
    widget: relation
    collection: research_areas
    search_fields:
    - name
    display_fields:
    - name
    value_field: slug
    multiple: true
    required: false
  - label: Reference URL (optional)
    name: source_url
    widget: string
    required: false
    hint: Optional link to any page or document that supports this information.
  - label: Last verified
    name: verified_on
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
  - label: Publish this publication
    name: published
    widget: boolean
    default: false
