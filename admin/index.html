<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#8D1838">
    <title>Content editor | UP Economics Research Center</title>
    <link rel="stylesheet" href="/design/site-concept.css">
    <style>
      :root { color-scheme: light; }
      .setup-note { max-width: 52rem; margin: 1rem auto; padding: 1rem 1.25rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: 16px; }
      .setup-note[hidden] { display: none; }
      .setup-note a { color: var(--wine); }
    </style>
  </head>
  <body>
    <aside class="setup-note" id="setup-note" role="status" hidden>
      <strong>Editor setup is not complete.</strong>
      <span>A repository owner must configure the GitHub OAuth App and Worker before editors can log in. Follow the owner setup in the project README.</span>
      <a href="https://github.com/UP-Economics-Research-Center/up-economics-research-center.github.io#owner-setup-github-sign-in">Open setup instructions</a>
    </aside>
    <script src="./setup-status.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script src="./preview-templates.js"></script>
  </body>
</html>
